# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name northlinkcollegelms.smartgov.co.za;
    return 301 https://$host$request_uri;
}

# HTTPS — proxy to Docker container
server {
    listen 443 ssl;
    server_name northlinkcollegelms.smartgov.co.za;

    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/northlinkcollegelms.smartgov.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/northlinkcollegelms.smartgov.co.za/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Max upload size (match PHP config)
    client_max_body_size 64M;

    # Proxy to Docker container
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
